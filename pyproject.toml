[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: tests that take more than a second"]

[tool.coverage.run]
branch = true
source = ["flashcards", "main", "utils"]
omit = ["starter/*", ".venv/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "^\\s*\\.\\.\\.$",
]

[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = "/(starter|mutants|\\.venv)/"

[tool.isort]
profile = "black"
line_length = 88
skip = ["starter", ".venv", "mutants"]

[tool.mypy]
python_version = "3.10"
files = ["flashcards", "main.py", "utils"]
exclude = "^(starter|mutants|\\.venv|tests)/"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

# Original starter utilities keep the template's looser typing.
[[tool.mypy.overrides]]
module = "utils.*"
disallow_untyped_defs = false
warn_return_any = false

[tool.mutmut]
source_paths = ["flashcards/", "main.py"]
also_copy = ["utils/", "data/", "pyproject.toml"]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-x", "-q", "-m", "not slow", "--no-cov"]
